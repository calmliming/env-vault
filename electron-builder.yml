# electron-builder 打包配置（阶段 7）
#
# ⚠️ 三平台的配置都写了，但**只有 Windows 在这台机器上真打过、真跑过**。
# mac / Linux 那两段是照文档写的，没有验证过 —— RELEASE.md 里如实标着。
# 一份没跑过的配置和「只验过假实现的集成」是同一种东西，别当成已完成。
#
# 🔴 不做代码签名。未签名的 Windows 包会被 SmartScreen 拦，
# 这一点必须写在发布说明里，而不是让用户自己撞上去。

appId: dev.envvault.app
productName: EnvVault
copyright: EnvVault

directories:
  output: release
  buildResources: build

# 打进包里的只有构建产物和运行时依赖。
# 源码、脚本、文档、验收产物一律不进 —— 尤其是 out/verify（那里面有样例假 Key）。
files:
  - out/main/**
  - out/preload/**
  - out/renderer/**
  - package.json
  - '!out/verify/**'

# asar 打开：它不是安全边界（谁都能解开），但能防止依赖被无意改动，
# 也让安装目录干净一些。
asar: true

win:
  # 便携版和安装器都出。便携版给不想装的人；
  # 安装器才写得了 PATH，而 `envvault run` 只有进了 PATH 才好用。
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  # 🔴 没有 certificateFile / certificatePassword —— 这是有意的，见文件顶部。
  # 有证书时从环境变量传入（CSC_LINK / CSC_KEY_PASSWORD），不要写进这个文件。
  #
  # 📌 这里曾经有一行 `signAndEditExecutable: false`，是环境妥协，不是设计选择：
  # electron-builder 解压 winCodeSign 工具包时要创建 macOS dylib 的符号链接，
  # 而 Windows 上建符号链接需要管理员权限或开发者模式，当时两样都没有，
  # 解压失败会让整个打包中止。代价是 rcedit 也在同一条路径上，
  # exe 的图标和版本信息写不进去。
  #
  # 这台机器现在开了开发者模式，那行已删除。
  # 如果将来打包又死在 winCodeSign 解压上，先确认开发者模式还开着
  # （设置 → 系统 → 开发者选项），不要直接把那行加回来 —— 加回来图标就又没了。
  # 详见 RELEASE.md。

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: EnvVault
  # 🔴 卸载时不删用户数据：Vault 主密钥和数据库都在 userData 下。
  # 卸载一次就把用户全部配置和凭据删光，是不可逆的破坏。
  deleteAppDataOnUninstall: false
  include: build/installer.nsh

mac:
  # ⚠️ 未验证：这台机器上打不出 mac 包，也没跑过。
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch: [arm64, x64]
  # 硬化运行时 + 公证需要 Apple 开发者账号，同样没做。
  hardenedRuntime: false

linux:
  # ⚠️ 未验证：同上。
  category: Development
  target:
    - target: AppImage
      arch: [x64]
